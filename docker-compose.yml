services:

  redis:
    image: redis:latest
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"

  app1:
    build: .
    container_name: rate-limiter-app-1
    expose:
      - "8081"
    depends_on:
      - redis

  app2:
    build: .
    container_name: rate-limiter-app-2
    expose:
      - "8081"
    depends_on:
      - redis

  nginx:
    image: nginx:latest
    container_name: rate-limiter-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2